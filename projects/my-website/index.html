<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
background:
linear-gradient(rgba(0,0,70,0.7), rgba(0,0,70,0.7)),
url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1974&auto=format&fit=crop');

background-size:cover;
background-position:center;
color:white;
}

nav{
display:flex;
align-items:center;
padding:20px 50px;
}

.logo{
width:90px;
height:90px;
border-radius:50%;
background:black;
display:flex;
justify-content:center;
align-items:center;
margin-right:40px;
}

.logo i{
font-size:45px;
color:white;
}

nav ul{
display:flex;
list-style:none;
gap:40px;
}

nav ul li a{
text-decoration:none;
color:white;
font-size:22px;
}

.hero{
height:80vh;
display:flex;
align-items:center;
padding-left:200px;
}

.hero h1{
font-size:70px;
}

.hero h2{
font-size:40px;
}

</style>
</head>

<body>

<nav>

<div class="logo">
<i class="fa-brands fa-reddit-alien"></i>
</div>

<ul>
<li><a href="#">HOME</a></li>
<li><a href="#">SERVICE</a></li>
<li><a href="#">ABOUT</a></li>
<li><a href="#">CONTACT</a></li>
</ul>

</nav>

<div class="hero">

<div>
<h1>Welcome</h1>
<h2>To Our Company</h2>
</div>

</div>

</body>
</html>
