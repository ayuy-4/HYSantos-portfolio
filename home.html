<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background-image:url('https://images.unsplash.com/photo-1518770660439-4636190af475');
            background-size:cover;
            background-position:center;
            height:100vh;
            color:white;
        }

        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 50px;
            background:rgba(0,0,0,0.5);
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:20px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
            font-size:18px;
        }

        .hero{
            height:80vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            text-align:center;
        }

        .hero h1{
            font-size:60px;
        }

        .hero p{
            font-size:22px;
            margin-top:10px;
        }

        button{
            margin-top:20px;
            padding:12px 25px;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <nav>

        <h2>My Portfolio</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Service</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </nav>

    <div class="hero">

        <h1>Welcome</h1>
        <p>To My Website</p>

        <button>Explore</button>

    </div>

</body>

</html>
