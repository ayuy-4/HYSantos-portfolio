<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

.container{
display:flex;
height:100vh;
}

.left{
width:55%;
background:
linear-gradient(rgba(0,0,100,0.6), rgba(0,0,100,0.7)),
url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=2070&auto=format&fit=crop');

background-size:cover;
background-position:center;
}

.right{
width:45%;
background:#f3f3f3;
display:flex;
justify-content:center;
align-items:center;
}

.form-box{
width:70%;
}

.icon-circle{
width:120px;
height:120px;
background:black;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
margin:auto;
margin-bottom:20px;
}

.icon-circle i{
font-size:60px;
color:white;
}

h1{
text-align:center;
margin-bottom:30px;
}

.input-box{
margin-bottom:20px;
position:relative;
}

.input-box input{
width:100%;
padding:15px;
border:none;
background:#ddd;
font-size:18px;
}

.input-box i{
position:absolute;
right:15px;
top:18px;
color:gray;
}

button{
width:100%;
padding:15px;
background:#4b17ff;
border:none;
color:white;
font-size:25px;
cursor:pointer;
}

.signup-link{
text-align:center;
margin-top:20px;
}

.signup-link a{
text-decoration:none;
color:blue;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="left"></div>

<div class="right">

<div class="form-box">

<div class="icon-circle">
<i class="fa-brands fa-reddit-alien"></i>
</div>

<h1>Sign in to your account.</h1>

<div class="input-box">
<input type="email" placeholder="email">
</div>

<div class="input-box">
<input type="password" placeholder="password">
<i class="fa-solid fa-eye-slash"></i>
</div>

<a href="index.html">
<button>Login</button>
</a>

<div class="signup-link">
Dont have account?
<a href="signup.html">Create Account</a>
</div>

</div>

</div>

</div>

<a href="home.html">Login</a>
  
</body>
</html>
